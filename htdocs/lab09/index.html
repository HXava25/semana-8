<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab09 - PHP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            padding: 32px;
        }
        .card {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            padding: 24px;
        }
        h1 { text-align: center; }
        form { display: grid; gap: 14px; }
        label { font-weight: 600; }
        input, select, textarea, button {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
            box-sizing: border-box;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 700;
        }
        .links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .links a {
            text-decoration: none;
            color: #1d4ed8;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Formulario PHP - Lab09</h1>
        <form action="procesar.php" method="post" novalidate>
            <div>
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" maxlength="80" required>
            </div>

            <div>
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" maxlength="120" required>
            </div>

            <div>
                <label for="curso">Curso</label>
                <select id="curso" name="curso" required>
                    <option value="">Seleccione...</option>
                    <option value="Desarrollo de Aplicaciones Web">Desarrollo de Aplicaciones Web</option>
                    <option value="Arquitectura Cliente-Servidor">Arquitectura Cliente-Servidor</option>
                    <option value="Backend con PHP y JSP">Backend con PHP y JSP</option>
                </select>
            </div>

            <div>
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="4" maxlength="250" required></textarea>
            </div>

            <button type="submit">Enviar</button>
        </form>

        <div class="links">
            <a href="comparativa.php">Ver comparación PHP vs JSP</a>
            <a href="../..\tomcat\webapps\lab09\index.jsp">Ir a JSP</a>
        </div>
    </div>
</body>
</html>
